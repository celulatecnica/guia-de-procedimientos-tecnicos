<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPT Directv Latinoamérica</title>
  <link rel="icon" type="image/png" href="imagenes/logo-directv.png">
  <style>
    * {
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    html,
    body {
      margin: 0;
      overflow-x: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0F0F0F;
      color: #f5f5f7;
      padding-top: 0;
    }
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- CONTEÚDO PRINCIPAL -->
  <div id="appContent">
    <iframe id="docFrame"></iframe>
  </div>

  <script>
    // =====================================================================
    // DEBUG HELPER
    // =====================================================================
    const DEBUG = true;
    function log(label, message) {
      if (DEBUG) {
        console.log(`[${new Date().toLocaleTimeString()}] ${label}: ${message}`);
      }
    }

    function logError(label, error) {
      if (DEBUG) {
        console.error(`[${new Date().toLocaleTimeString()}] ${label}:`, error);
      }
    }

    // =====================================================================
    // UTILITY FUNCTIONS
    // =====================================================================
    
    function setStatus(text) {
      const el = document.getElementById("status");
      if (el) el.textContent = text;
      log("STATUS", text);
    }

    function showLoginOverlay() {
      document.getElementById("loginOverlay").classList.remove("hidden");
      document.getElementById("appContent").classList.add("app-locked");
      document.getElementById("btnLogin").disabled = false;
    }

    function hideLoginOverlay() {
      document.getElementById("loginOverlay").classList.add("hidden");
      document.getElementById("appContent").classList.remove("app-locked");
    }

    function getRequestedDocKey() {
      const params = new URLSearchParams(window.location.search);
      return params.get("doc") || "gpt";
    }

    function loadDocument(docKey) {
      const frame = document.getElementById("docFrame");
      let pdfFile = docKey === "gpt" ? "gpt.pdf" : `gpt_${docKey}.pdf`;
      frame.src = `archivos_pdf/${pdfFile}#view=FitH`;
      log("DOC", `Documento carregado: ${pdfFile}`);
    }

    // =====================================================================
    // GESTÃO DE CONTAS
    // =====================================================================
    
    function getActiveAccount() {
      if (!msalInstance) return null;
      
      const activeAccount = msalInstance.getActiveAccount();
      if (activeAccount) {
        log("ACCOUNT", `Conta ativa: ${activeAccount.username}`);
        return activeAccount;
      }

      const allAccounts = msalInstance.getAllAccounts();
      log("ACCOUNT", `Total de contas: ${allAccounts.length}`);
      
      if (allAccounts.length > 0) {
        log("ACCOUNT", `Usando primeira conta: ${allAccounts[0].username}`);
        return allAccounts[0];
      }

      return null;
    }

    function updateUserDisplay() {
      const email = document.getElementById("userEmail");
      const account = getActiveAccount();
      email.textContent = account ? (account.username || account.name || "") : "";
    }

    async function clearAllAccounts() {
      if (!msalInstance) return;
      
      const allAccounts = msalInstance.getAllAccounts();
      log("CLEAR", `Removendo ${allAccounts.length} contas`);
      
      for (let account of allAccounts) {
        try {
          await msalInstance.getTokenCache().removeAccount(account);
        } catch (e) {
          logError("CLEAR", e);
        }
      }
      
      msalInstance.setActiveAccount(null);
    }

    // =====================================================================
    // INICIALIZAÇÃO
    // =====================================================================
    
    async function initializeMsal() {
      if (isInitialized) {
        log("INIT", "MSAL já foi inicializado");
        return;
      }

      isProcessing = true;

      try {
        log("INIT", "Iniciando MSAL...");
        setStatus("Inicializando autenticación...");
        document.getElementById("btnLogin").disabled = true;

        if (typeof msal === "undefined") {
          throw new Error("MSAL library não foi carregada");
        }

        msalInstance = new msal.PublicClientApplication(msalConfig);
        log("INIT", "Instância criada");

        if (typeof msalInstance.initialize === "function") {
          await msalInstance.initialize();
          log("INIT", "MSAL.initialize() executado");
        }

        // 🔧 PROCESSA REDIRECT DO MICROSOFT
        log("INIT", "Processando handleRedirectPromise()...");
        const response = await msalInstance.handleRedirectPromise();

        if (response) {
          log("INIT", `✓ Login bem-sucedido após redirect: ${response.account.username}`);
          msalInstance.setActiveAccount(response.account);
        } else {
          log("INIT", "Nenhum redirect pendente");
        }

        isInitialized = true;
        isProcessing = false;

        // Verifica se está autenticado
        await checkAndDisplayAuth();

      } catch (error) {
        logError("INIT", error);
        isProcessing = false;
        setStatus("Error ao inicializar a autenticación.");
        showLoginOverlay();
      }
    }

    // =====================================================================
    // VERIFICAÇÃO DE AUTENTICAÇÃO
    // =====================================================================
    
    async function checkAndDisplayAuth() {
      log("AUTH", "Verificando autenticação...");
      
      const docKey = getRequestedDocKey();
      loadDocument(docKey);

      const account = getActiveAccount();

      if (!account) {
        log("AUTH", "❌ Usuário não autenticado");
        showLoginOverlay();
        setStatus("Listo para iniciar sesión.");
        return;
      }

      log("AUTH", `✓ Usuário autenticado: ${account.username}`);
      msalInstance.setActiveAccount(account);
      updateUserDisplay();
      hideLoginOverlay();
    }

    // =====================================================================
    // LOGIN
    // =====================================================================
    
    async function handleLogin() {
      if (isProcessing || !msalInstance) {
        log("LOGIN", "⚠ Já há um processo em andamento ou MSAL não inicializado");
        return;
      }

      isProcessing = true;
      document.getElementById("btnLogin").disabled = true;
      setStatus("Abriendo sesión de Microsoft...");

      try {
        log("LOGIN", "Iniciando loginRedirect()...");

        // 🔧 LIMPA CONTAS ANTIGAS
        await clearAllAccounts();

        // 🔧 USA REDIRECT EM VEZ DE POPUP
        await msalInstance.loginRedirect({
          ...loginRequest,
          prompt: "select_account"
        });

        // Se chegou aqui, o redirect foi iniciado
        log("LOGIN", "Redirecionamento para Microsoft iniciado...");
        setStatus("Redirecionando a Microsoft...");

      } catch (error) {
        logError("LOGIN", error);
        isProcessing = false;

        if (error.errorCode === "user_cancelled") {
          log("LOGIN", "Usuário cancelou o login");
          setStatus("Login cancelado.");
        } else {
          setStatus("Error en la autenticación.");
        }

        document.getElementById("btnLogin").disabled = false;
      }
    }

    // =====================================================================
    // LOGOUT
    // =====================================================================
    
    async function logout() {
      if (isProcessing) return;

      isProcessing = true;
      setStatus("Cerrando sesión...");
      document.getElementById("btnLogin").disabled = true;

      try {
        log("LOGOUT", "Iniciando logout...");

        const account = getActiveAccount();

        if (account) {
          log("LOGOUT", `Logout da conta: ${account.username}`);
          
          // 🔧 USA REDIRECT PARA LOGOUT
          await msalInstance.logoutRedirect({
            account: account
          });
        } else {
          log("LOGOUT", "Nenhuma conta para fazer logout");
          
          await clearAllAccounts();
          isInitialized = false;
          
          document.getElementById("userEmail").textContent = "";
          showLoginOverlay();
          setStatus("Sesión cerrada. Vuelve a iniciar sesión.");
        }

      } catch (error) {
        logError("LOGOUT", error);
        
        // Mesmo com erro, limpa a UI
        await clearAllAccounts();
        isInitialized = false;
        
        document.getElementById("userEmail").textContent = "";
        showLoginOverlay();
        setStatus("Sesión cerrada.");
      }

      isProcessing = false;
    }

    // =====================================================================
    // EVENT LISTENERS
    // =====================================================================
    
    window.addEventListener("load", async () => {
      log("APP", "Página carregada");
      await initializeMsal();
    });

    window.addEventListener("focus", async () => {
      if (isInitialized && !isProcessing) {
        log("APP", "Janela em foco");
        await checkAndDisplayAuth();
      }
    });

    // 🔧 AVISA SE TENTAR FECHAR DURANTE PROCESSAMENTO
    window.addEventListener("beforeunload", (e) => {
      if (isProcessing) {
        e.preventDefault();
        e.returnValue = "Um login está em progresso...";
      }
    });

  </script>
</body>
</html>
