<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teste Login Microsoft</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    .card {
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.12);
      text-align: center;
      width: 360px;
      max-width: calc(100% - 40px);
    }

    button {
      background: #0078d4;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 14px;
    }

    button:disabled {
      background: #8bb8da;
      cursor: not-allowed;
    }

    #status {
      margin-top: 16px;
      font-size: 14px;
      color: #444;
      min-height: 20px;
      word-break: break-word;
    }
  </style>

  <script src="js/msal-browser.min.js"></script>
</head>
<body>
  <div class="card">
    <h2>Teste Microsoft Login</h2>
    <button id="loginBtn" onclick="login()" disabled>Entrar com Microsoft</button>
    <div id="status">Carregando...</div>
  </div>

  <script>
    const msalConfig = {
      auth: {
        clientId: "bd3d9316-4683-4aea-ad47-8c237cdceb5e",
        authority: "https://login.microsoftonline.com/4abdf8c8-91c3-4c1b-9c71-6266b586ec6b",
        redirectUri: "https://celulatecnica.github.io/guia-de-procedimientos-tecnicos/"
      },
      cache: {
        cacheLocation: "sessionStorage",
        storeAuthStateInCookie: false
      }
    };

    let msalInstance;

    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
    }

    async function init() {
      try {
        if (typeof msal === "undefined") {
          setStatus("MSAL local não foi encontrado.");
          return;
        }

        msalInstance = new msal.PublicClientApplication(msalConfig);

        document.getElementById("loginBtn").disabled = false;
        setStatus("Pronto para autenticar.");
      } catch (error) {
        console.error(error);
        setStatus("Erro ao iniciar MSAL.");
      }
    }

    async function login() {
      try {
        document.getElementById("loginBtn").disabled = true;
        setStatus("Abrindo login...");

        const response = await msalInstance.loginPopup({
          scopes: ["User.Read", "openid", "profile", "email"]
        });

        setStatus("Logado como: " + (response.account?.username || response.account?.name || "usuário"));
      } catch (error) {
        console.error(error);
        setStatus("Falha no login.");
        document.getElementById("loginBtn").disabled = false;
      }
    }

    window.addEventListener("load", init);
  </script>
</body>
</html>
