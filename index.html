<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPT Directv Latinoamérica</title>
  <link rel="icon" type="image/png" href="imagenes/logo-directv.png">
  <style>
    * {
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    html,
    body {
      margin: 0;
      overflow-x: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0F0F0F;
      color: #f5f5f7;
      padding-top: 0;
    }
    .btn-login {
      width: 50%;
      height: 48px;
      padding: 0;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: #0071e3;
      color: white;
      border: none;
      border-radius: 12px;
      transition: all 0.2s ease;
    }
    .btn-login:hover:not(:disabled) {
      background: #0077ED;
      transform: translateY(-1px);
    }
    .btn-login:active:not(:disabled) {
      transform: translateY(0);
    }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .login-header {
      margin-bottom: 20px;
    }
    #topbar {
      position: fixed;
      top: 18px;
      right: 200px;
      z-index: 1000;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #btnLogout {
      background: #0071e3;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    #btnLogout:hover {
      background: #0077ED;
    }
    #userEmail {
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 500;
      opacity: .9;
    }
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }
    .app-locked {
      filter: blur(8px);
      pointer-events: none;
      user-select: none;
      transition: filter 0.3s ease;
    }
    .app-unlocked {
      filter: blur(0);
      pointer-events: auto;
      user-select: auto;
    }
    .login-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.20);
    }
    .login-overlay.hidden {
      display: none;
    }
    .login-card {
      width: 520px;
      max-width: calc(100% - 32px);
      background: rgba(23, 23, 23, 0.95);
      border: 1px solid #2A2A2A;
      border-radius: 16px;
      padding: 48px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
      color: #f5f5f7;
      text-align: center;
      animation: slideUp 0.4s ease;
    }
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .login-logo {
      height: 20px;
      margin-left: auto;
      margin-right: auto;
      margin-bottom: 25px;
      margin-top: 18px;
      display: block;
    }
    .login-card h2 {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
      color: #f5f5f7;
    }
    .login-description {
      margin: 16px 0 24px 0;
      font-size: 16px;
      line-height: 1.6;
      color: #d1d1d6;
    }
    .status {
      margin-top: 12px;
      font-size: 16px;
      color: #8e8e93;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.0/lib/msal-browser.min.js"></script>
</head>
<body>
  <!-- CONTEÚDO PRINCIPAL -->
  <div id="appContent" class="app-locked">
    <div id="topbar">
      <span id="userEmail"></span>
      <button id="btnLogout" onclick="logout()">
        Salir
      </button>
    </div>
    <iframe id="docFrame"></iframe>
  </div>
  <!-- OVERLAY DE LOGIN -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-card">
      <div class="login-header">
        <img src="imagenes/directv.png" alt="Directv" class="login-logo">
        <h2>Guía de Procedimientos Técnicos</h2>
      </div>
      <p class="login-description">
        Inicia sesión con tu cuenta corporativa para aceder a los manuales de atención técnica.
      </p>
      <button id="btnLogin" class="btn-login" onclick="handleLogin()" disabled>
        <span>Iniciar sesión</span>
      </button>
      <div id="status" class="status">Cargando la autenticación...</div>
    </div>
  </div>

  <script>
    // =====================================================================
    // DEBUG HELPER
    // =====================================================================
    const DEBUG = true;
    function log(label, message) {
      if (DEBUG) {
        console.log(`[${new Date().toLocaleTimeString()}] ${label}: ${message}`);
      }
    }

    function logError(label, error) {
      if (DEBUG) {
        console.error(`[${new Date().toLocaleTimeString()}] ${label}:`, error);
      }
    }

    // =====================================================================
    // CONFIGURAÇÃO MSAL
    // =====================================================================
    const redirectUri = window.location.origin + window.location.pathname;
    
    const msalConfig = {
      auth: {
        clientId: "bd3d9316-4683-4aea-ad47-8c237cdceb5e",
        authority: "https://login.microsoftonline.com/4abdf8c8-91c3-4c1b-9c71-6266b586ec6b",
        redirectUri: redirectUri,
        postLogoutRedirectUri: redirectUri
      },
      cache: {
        cacheLocation: "localStorage",
        storeAuthStateInCookie: false
      }
    };

    const loginRequest = {
      scopes: ["openid", "profile", "email", "User.Read"]
    };

    // =====================================================================
    // ESTADO GLOBAL
    // =====================================================================
    let msalInstance = null;
    let isInitialized = false;
    let isProcessing = false;

    // =====================================================================
    // UTILITY FUNCTIONS
    // =====================================================================
    
    function setStatus(text) {
      const el = document.getElementById("status");
      if (el) el.textContent = text;
      log("STATUS", text);
    }

    function showLoginOverlay() {
      document.getElementById("loginOverlay").classList.remove("hidden");
      document.getElementById("appContent").classList.add("app-locked");
      document.getElementById("btnLogin").disabled = false;
    }

    function hideLoginOverlay() {
      document.getElementById("loginOverlay").classList.add("hidden");
      document.getElementById("appContent").classList.remove("app-locked");
    }

    function getRequestedDocKey() {
      const params = new URLSearchParams(window.location.search);
      return params.get("doc") || "gpt";
    }

    function loadDocument(docKey) {
      const frame = document.getElementById("docFrame");
      let pdfFile = docKey === "gpt" ? "gpt.pdf" : `gpt_${docKey}.pdf`;
      frame.src = `archivos_pdf/${pdfFile}#view=FitH`;
      log("DOC", `Documento carregado: ${pdfFile}`);
    }

    // =====================================================================
    // GESTÃO DE CONTAS
    // =====================================================================
    
    function getActiveAccount() {
      if (!msalInstance) return null;
      
      const activeAccount = msalInstance.getActiveAccount();
      if (activeAccount) {
        log("ACCOUNT", `Conta ativa: ${activeAccount.username}`);
        return activeAccount;
      }

      const allAccounts = msalInstance.getAllAccounts();
      log("ACCOUNT", `Total de contas: ${allAccounts.length}`);
      
      if (allAccounts.length > 0) {
        log("ACCOUNT", `Usando primeira conta: ${allAccounts[0].username}`);
        return allAccounts[0];
      }

      return null;
    }

    function updateUserDisplay() {
      const email = document.getElementById("userEmail");
      const account = getActiveAccount();
      email.textContent = account ? (account.username || account.name || "") : "";
    }

    async function clearAllAccounts() {
      if (!msalInstance) return;
      
      const allAccounts = msalInstance.getAllAccounts();
      log("CLEAR", `Removendo ${allAccounts.length} contas`);
      
      for (let account of allAccounts) {
        try {
          await msalInstance.getTokenCache().removeAccount(account);
        } catch (e) {
          logError("CLEAR", e);
        }
      }
      
      msalInstance.setActiveAccount(null);
    }

    // =====================================================================
    // INICIALIZAÇÃO
    // =====================================================================
    
    async function initializeMsal() {
      if (isInitialized) {
        log("INIT", "MSAL já foi inicializado");
        return;
      }

      isProcessing = true;

      try {
        log("INIT", "Iniciando MSAL...");
        setStatus("Inicializando autenticación...");
        document.getElementById("btnLogin").disabled = true;

        if (typeof msal === "undefined") {
          throw new Error("MSAL library não foi carregada");
        }

        msalInstance = new msal.PublicClientApplication(msalConfig);
        log("INIT", "Instância criada");

        if (typeof msalInstance.initialize === "function") {
          await msalInstance.initialize();
          log("INIT", "MSAL.initialize() executado");
        }

        // 🔧 PROCESSA REDIRECT DO MICROSOFT
        log("INIT", "Processando handleRedirectPromise()...");
        const response = await msalInstance.handleRedirectPromise();

        if (response) {
          log("INIT", `✓ Login bem-sucedido após redirect: ${response.account.username}`);
          msalInstance.setActiveAccount(response.account);
        } else {
          log("INIT", "Nenhum redirect pendente");
        }

        isInitialized = true;
        isProcessing = false;

        // Verifica se está autenticado
        await checkAndDisplayAuth();

      } catch (error) {
        logError("INIT", error);
        isProcessing = false;
        setStatus("Error ao inicializar a autenticación.");
        showLoginOverlay();
      }
    }

    // =====================================================================
    // VERIFICAÇÃO DE AUTENTICAÇÃO
    // =====================================================================
    
    async function checkAndDisplayAuth() {
      log("AUTH", "Verificando autenticação...");
      
      const docKey = getRequestedDocKey();
      loadDocument(docKey);

      const account = getActiveAccount();

      if (!account) {
        log("AUTH", "❌ Usuário não autenticado");
        showLoginOverlay();
        setStatus("Listo para iniciar sesión.");
        return;
      }

      log("AUTH", `✓ Usuário autenticado: ${account.username}`);
      msalInstance.setActiveAccount(account);
      updateUserDisplay();
      hideLoginOverlay();
    }

    // =====================================================================
    // LOGIN
    // =====================================================================
    
    async function handleLogin() {
      if (isProcessing || !msalInstance) {
        log("LOGIN", "⚠ Já há um processo em andamento ou MSAL não inicializado");
        return;
      }

      isProcessing = true;
      document.getElementById("btnLogin").disabled = true;
      setStatus("Abriendo sesión de Microsoft...");

      try {
        log("LOGIN", "Iniciando loginRedirect()...");

        // 🔧 LIMPA CONTAS ANTIGAS
        await clearAllAccounts();

        // 🔧 USA REDIRECT EM VEZ DE POPUP
        await msalInstance.loginRedirect({
          ...loginRequest,
          prompt: "select_account"
        });

        // Se chegou aqui, o redirect foi iniciado
        log("LOGIN", "Redirecionamento para Microsoft iniciado...");
        setStatus("Redirecionando a Microsoft...");

      } catch (error) {
        logError("LOGIN", error);
        isProcessing = false;

        if (error.errorCode === "user_cancelled") {
          log("LOGIN", "Usuário cancelou o login");
          setStatus("Login cancelado.");
        } else {
          setStatus("Error en la autenticación.");
        }

        document.getElementById("btnLogin").disabled = false;
      }
    }

    // =====================================================================
    // LOGOUT
    // =====================================================================
    
    async function logout() {
  if (isProcessing) return;

  isProcessing = true;
  setStatus("Cerrando sesión...");
  document.getElementById("btnLogin").disabled = true;

  try {
    log("LOGOUT", "Iniciando logout...");

    const account = getActiveAccount();

    if (account) {
      log("LOGOUT", `Logout da conta: ${account.username}`);
      
      // 🔧 USA POPUP EM VEZ DE REDIRECT
      await msalInstance.logoutPopup({
        account: account,
        mainWindowRedirectUri: redirectUri // 🔧 RETORNA PARA AQUI
      });
    }

    // Limpa após logout
    await clearAllAccounts();
    isInitialized = false;
    
    document.getElementById("userEmail").textContent = "";
    showLoginOverlay();
    setStatus("Sesión cerrada. Vuelve a iniciar sesión.");

  } catch (error) {
    logError("LOGOUT", error);
    
    // Mesmo com erro, limpa a UI
    await clearAllAccounts();
    isInitialized = false;
    
    document.getElementById("userEmail").textContent = "";
    showLoginOverlay();
    setStatus("Sesión cerrada.");
  }

  isProcessing = false;
}

    // =====================================================================
    // EVENT LISTENERS
    // =====================================================================
    
    window.addEventListener("load", async () => {
      log("APP", "Página carregada");
      await initializeMsal();
    });

    window.addEventListener("focus", async () => {
      if (isInitialized && !isProcessing) {
        log("APP", "Janela em foco");
        await checkAndDisplayAuth();
      }
    });

    // 🔧 AVISA SE TENTAR FECHAR DURANTE PROCESSAMENTO
    window.addEventListener("beforeunload", (e) => {
      if (isProcessing) {
        e.preventDefault();
        e.returnValue = "Um login está em progresso...";
      }
    });

  </script>
</body>
</html>
