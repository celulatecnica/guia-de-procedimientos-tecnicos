<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPT Directv Latinoamérica</title>
  <link rel="icon" type="image/png" href="imagenes/logo-directv.png">
  <style>
    * {
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    html,
    body {
      margin: 0;
      overflow-x: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0F0F0F;
      color: #f5f5f7;
      padding-top: 0;
    }
    .btn-login {
      width: 50%;
      height: 48px;
      padding: 0;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: #0071e3;
      color: white;
      border: none;
      border-radius: 12px;
      transition: all 0.2s ease;
    }
    .btn-login:hover:not(:disabled) {
      background: #0077ED;
      transform: translateY(-1px);
    }
    .btn-login:active:not(:disabled) {
      transform: translateY(0);
    }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .login-header {
      margin-bottom: 20px;
    }
    #topbar {
      position: fixed;
      top: 18px;
      right: 200px;
      z-index: 1000;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #btnLogout {
      background: #0071e3;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    #btnLogout:hover {
      background: #0077ED;
    }
    #userEmail {
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 500;
      opacity: .9;
    }
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }
    .app-locked {
      filter: blur(8px);
      pointer-events: none;
      user-select: none;
      transition: filter 0.3s ease;
    }
    .app-unlocked {
      filter: blur(0);
      pointer-events: auto;
      user-select: auto;
    }
    .login-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.20);
    }
    .login-overlay.hidden {
      display: none;
    }
    .login-card {
      width: 520px;
      max-width: calc(100% - 32px);
      background: rgba(23, 23, 23, 0.95);
      border: 1px solid #2A2A2A;
      border-radius: 16px;
      padding: 48px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
      color: #f5f5f7;
      text-align: center;
      animation: slideUp 0.4s ease;
    }
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .login-logo {
      height: 20px;
      margin-left: auto;
      margin-right: auto;
      margin-bottom: 25px;
      margin-top: 18px;
      display: block;
    }
    .login-card h2 {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
      color: #f5f5f7;
    }
    .login-description {
      margin: 16px 0 24px 0;
      font-size: 16px;
      line-height: 1.6;
      color: #d1d1d6;
    }
    .status {
      margin-top: 12px;
      font-size: 16px;
      color: #8e8e93;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.0/lib/msal-browser.min.js"></script>
</head>
<body>
  <!-- CONTEÚDO PRINCIPAL -->
  <div id="appContent" class="app-locked">
    <div id="topbar">
      <span id="userEmail"></span>
      <button id="btnLogout" onclick="logout()">
        Salir
      </button>
    </div>
    <iframe id="docFrame"></iframe>
  </div>
  <!-- OVERLAY DE LOGIN -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-card">
      <div class="login-header">
        <img src="imagenes/directv.png" alt="Directv" class="login-logo">
        <h2>Guía de Procedimientos Técnicos</h2>
      </div>
      <p class="login-description">
        Inicia sesión con tu cuenta corporativa para aceder a los manuales de atención técnica.
      </p>
      <button id="btnLogin" class="btn-login" onclick="login()" disabled>
        <span>Iniciar sesión</span>
      </button>
      <div id="status" class="status">Cargando la autenticación...</div>
    </div>
  </div>
  <script>
    // =====================================================================
    // CONSTANTES Y CONFIGURACIÓN
    // =====================================================================
    const redirectUri = window.location.origin + window.location.pathname;
    
    const msalConfig = {
      auth: {
        clientId: "bd3d9316-4683-4aea-ad47-8c237cdceb5e",
        authority: "https://login.microsoftonline.com/4abdf8c8-91c3-4c1b-9c71-6266b586ec6b",
        redirectUri: redirectUri
      },
      cache: {
        cacheLocation: "localStorage", // 🔧 MUDADO PARA localStorage PARA PERSISTÊNCIA
        storeAuthStateInCookie: false
      },
      system: {
        loggerOptions: {
          loggerCallback: (level, message, containsPii) => {
            if (!containsPii) {
              console.log(`[MSAL ${level}] ${message}`);
            }
          },
          piiLoggingEnabled: false,
          logLevel: msal.LogLevel.Warning
        }
      }
    };
    
    const loginRequest = {
      scopes: ["openid", "profile", "email", "User.Read"]
    };
    
    // =====================================================================
    // ESTADO GLOBAL
    // =====================================================================
    let msalInstance = null;
    let isInitialized = false;
    let isLoginInProgress = false;
    let authStateKey = "auth_state_processed"; // 🔧 CHAVE PARA RASTREAR PROCESSAMENTO

    // =====================================================================
    // FUNÇÕES AUXILIARES DE CACHE
    // =====================================================================
    
    function markAuthStateAsProcessed() {
      sessionStorage.setItem(authStateKey, "true");
      console.log("✓ Estado de autenticação marcado como processado");
    }

    function isAuthStateAlreadyProcessed() {
      return sessionStorage.getItem(authStateKey) === "true";
    }

    function resetAuthStateFlag() {
      sessionStorage.removeItem(authStateKey);
      console.log("✓ Flag de estado de autenticação removida");
    }

    function clearMsalCache() {
      try {
        // 🔧 LIMPA APENAS OS TOKENS, NÃO O ESTADO
        const cacheKeys = [
          "login.windows.net",
          "microsoftonline.com",
          "msal.request.scopes",
          "msal.interaction.status"
        ];

        for (let key in localStorage) {
          if (cacheKeys.some(k => key.includes(k))) {
            localStorage.removeItem(key);
          }
        }
        
        console.log("✓ Cache do MSAL limpo");
      } catch (error) {
        console.error("Erro ao limpar cache:", error);
      }
    }

    function getAllTokens() {
      console.log("=== TOKENS ATUAIS ===");
      if (msalInstance) {
        const accounts = msalInstance.getAllAccounts();
        console.log(`Contas encontradas: ${accounts.length}`);
        accounts.forEach((acc, idx) => {
          console.log(`[${idx}] ${acc.username}`);
        });
      }
    }

    // =====================================================================
    // FUNÇÕES DE UI
    // =====================================================================
    function setStatus(text) {
      const el = document.getElementById("status");
      if (el) el.textContent = text;
    }
    
    function showLoginOverlay() {
      document.getElementById("loginOverlay").classList.remove("hidden");
      document.getElementById("appContent").classList.add("app-locked");
      document.getElementById("btnLogin").disabled = false;
    }
    
    function hideLoginOverlay() {
      document.getElementById("loginOverlay").classList.add("hidden");
      document.getElementById("appContent").classList.remove("app-locked");
    }
    
    // =====================================================================
    // FUNÇÕES DE AUTENTICAÇÃO
    // =====================================================================
    function getBestAccount() {
      if (!msalInstance) return null;
      const activeAccount = msalInstance.getActiveAccount();
      if (activeAccount) return activeAccount;
      
      const allAccounts = msalInstance.getAllAccounts();
      return allAccounts.length > 0 ? allAccounts[0] : null;
    }
    
    function updateUserDisplay() {
      const email = document.getElementById("userEmail");
      if (!email) return;
      
      const account = getBestAccount();
      if (!account) {
        email.textContent = "";
        return;
      }
      email.textContent = account.username || account.name || "";
    }
    
    function getRequestedDocKey() {
      const params = new URLSearchParams(window.location.search);
      return params.get("doc") || "gpt";
    }
    
    function loadDocument(docKey) {
      const frame = document.getElementById("docFrame");
      let pdfFile;
      
      if (docKey === "gpt") {
        pdfFile = "gpt.pdf";
      } else {
        pdfFile = `gpt_${docKey}.pdf`;
      }
      
      frame.src = `archivos_pdf/${pdfFile}#view=FitH`;
      console.log(`📄 Documento carregado: ${pdfFile}`);
    }
    
    // =====================================================================
    // LÓGICA DE FLUXO
    // =====================================================================
    
    async function checkAuthStatus() {
      console.log("🔍 Verificando status de autenticação...");
      const docKey = getRequestedDocKey();
      loadDocument(docKey);
      
      const account = getBestAccount();
      
      if (!account) {
        console.log("❌ Usuário não autenticado");
        showLoginOverlay();
        setStatus("Listo para iniciar sesión.");
        return;
      }
      
      console.log(`✓ Usuário autenticado: ${account.username}`);
      msalInstance.setActiveAccount(account);
      updateUserDisplay();
      hideLoginOverlay();
    }
    
    async function initMsal() {
      if (isInitialized) {
        console.log("⚠ MSAL já foi inicializado");
        return;
      }
      
      try {
        console.log("🚀 Inicializando MSAL...");
        setStatus("Cargando la autenticación...");
        document.getElementById("btnLogin").disabled = true;
        
        if (typeof msal === "undefined") {
          throw new Error("MSAL library não foi carregada");
        }
        
        msalInstance = new msal.PublicClientApplication(msalConfig);
        
        if (typeof msalInstance.initialize === "function") {
          await msalInstance.initialize();
          console.log("✓ MSAL inicializado com sucesso");
        }
        
        // 🔧 PROCESSA REDIRECT APENAS UMA VEZ
        if (!isAuthStateAlreadyProcessed()) {
          console.log("⏳ Processando handleRedirectPromise...");
          try {
            const response = await msalInstance.handleRedirectPromise();
            
            if (response) {
              console.log("✓ Retorno do redirect detectado");
              if (response.account) {
                msalInstance.setActiveAccount(response.account);
                console.log(`✓ Conta ativa definida: ${response.account.username}`);
              }
            } else {
              console.log("ℹ Nenhum redirect pendente");
            }
          } catch (redirectError) {
            console.error("❌ Erro no redirect:", redirectError);
          }
          
          // 🔧 MARCA COMO PROCESSADO APÓS PRIMEIRA EXECUÇÃO
          markAuthStateAsProcessed();
        } else {
          console.log("⏭ Redirect já foi processado, pulando...");
        }
        
        isInitialized = true;
        await checkAuthStatus();
        
      } catch (error) {
        console.error("❌ Erro ao inicializar MSAL:", error);
        setStatus("Error al iniciar la autenticación.");
        showLoginOverlay();
      }
    }
    
    async function login() {
      try {
        if (!msalInstance) {
          alert("MSAL aún no se ha iniciado.");
          return;
        }
        
        if (isLoginInProgress) {
          console.log("⚠ Login já está em progresso");
          return;
        }
        
        isLoginInProgress = true;
        document.getElementById("btnLogin").disabled = true;
        setStatus("Abriendo sesión de Microsoft...");
        
        console.log("🔐 Iniciando login popup...");
        
        try {
          // 🔧 LIMPA ACCOUNTS ANTIGAS
          const allAccounts = msalInstance.getAllAccounts();
          console.log(`Removendo ${allAccounts.length} contas antigas`);
          
          for (let account of allAccounts) {
            await msalInstance.getTokenCache().removeAccount(account);
          }
          
          msalInstance.setActiveAccount(null);
          getAllTokens();
          
          // 🔧 LIMPA A FLAG PARA PERMITIR NOVO PROCESSAMENTO
          resetAuthStateFlag();
          
          const response = await msalInstance.loginPopup({
            ...loginRequest,
            prompt: "select_account",
            timeout: 60000
          });
          
          if (response && response.account) {
            console.log(`✓ Login bem-sucedido: ${response.account.username}`);
            msalInstance.setActiveAccount(response.account);
            
            // 🔧 MARCA COMO PROCESSADO APÓS LOGIN COM SUCESSO
            markAuthStateAsProcessed();
          }
          
          isLoginInProgress = false;
          await checkAuthStatus();
          
        } catch (popupError) {
          isLoginInProgress = false;
          
          if (popupError.errorCode === "user_cancelled") {
            console.log("ℹ Usuário cancelou o login");
            setStatus("Login cancelado. Intenta nuevamente.");
          } else if (popupError.errorCode === "interaction_in_progress") {
            console.log("⚠ Interação já em progresso");
            setStatus("Ya hay una sesión en progreso...");
          } else {
            console.error("❌ Erro no popup:", popupError);
            setStatus(`Fallo: ${popupError.errorCode}`);
          }
          
          document.getElementById("btnLogin").disabled = false;
        }
        
      } catch (error) {
        isLoginInProgress = false;
        console.error("❌ Erro geral no login:", error);
        setStatus("Fallo en la autenticación.");
        document.getElementById("btnLogin").disabled = false;
      }
    }
    
    async function logout() {
      try {
        console.log("🔓 Iniciando logout...");
        document.getElementById("btnLogin").disabled = true;
        setStatus("Cerrando sesión...");
        
        const account = getBestAccount();
        
        if (account) {
          try {
            console.log(`Logout da conta: ${account.username}`);
            await msalInstance.logoutPopup({ account });
          } catch (popupError) {
            console.error("⚠ Erro no logout popup:", popupError);
          }
        }
        
        // 🔧 LIMPA TODAS AS CONTAS
        const allAccounts = msalInstance.getAllAccounts();
        for (let acc of allAccounts) {
          await msalInstance.getTokenCache().removeAccount(acc);
        }
        
        msalInstance.setActiveAccount(null);
        document.getElementById("userEmail").textContent = "";
        
        // 🔧 FORÇA REINICIALIZAÇÃO
        isInitialized = false;
        resetAuthStateFlag();
        clearMsalCache();
        
        console.log("✓ Logout completo");
        showLoginOverlay();
        setStatus("Sesión cerrada. Vuelve a iniciar sesión.");
        
        // 🔧 REINICIA MSAL APÓS LOGOUT
        setTimeout(() => {
          initMsal();
        }, 500);
        
      } catch (error) {
        console.error("❌ Erro no logout:", error);
        document.getElementById("btnLogin").disabled = false;
        setStatus("Error al cerrar sesión.");
      }
    }
    
    // =====================================================================
    // EVENT LISTENERS
    // =====================================================================
    window.addEventListener("focus", () => {
      if (isInitialized && !isLoginInProgress) {
        console.log("🔄 Janela em foco, verificando autenticação...");
        checkAuthStatus().catch(console.error);
      }
    });
    
    window.addEventListener("popstate", () => {
      if (isInitialized && !isLoginInProgress) {
        console.log("🔄 Navegação detectada, verificando autenticação...");
        checkAuthStatus().catch(console.error);
      }
    });
    
    window.addEventListener("load", () => {
      console.log("📍 Página carregada");
      initMsal();
    });
    
    // 🔧 PREVINE RELOAD ACIDENTAL
    window.addEventListener("beforeunload", (e) => {
      if (isLoginInProgress) {
        e.preventDefault();
        e.returnValue = '';
      }
    });
  </script>
</body>
</html>
