<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPT | Guia de Procedimientos Técnicos</title>
  <link rel="icon" type="image/png" href="logo-directv.png">
  <style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #FFFFFF;
}

#login-screen {
  width: 100%;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  box-sizing: border-box;

  padding-top: 223px;
}

.login-card {
  background: #FBFBFD;
  width: 950px;
  min-height: 500px;
  padding: 90px 90px;
  border-radius: 12px;
  box-shadow: none;
  text-align: left;
  box-sizing: border-box;
}

.login-card img {
  display: block;
  width: 90px;
  height: auto;
  margin: 0 0 0 0;
  object-fit: contain;
}

.login-card h2 {
  font-size: 38px;
  font-weight: 700;
  line-height: 1.15;
  margin: 0 0 28px 0;
  text-align: left;
}

.login-card p {
  font-size: 22px;
  line-height: 1.5;
  margin: 0 0 30px 0;
  text-align: left;
}

.status {
  font-size: 16px;
  margin: 12px 0 12px 0;
  text-align: left;
}

.btn-login {
  display: block;
  font-size: 18px;
  padding: 18px 30px;
  margin: 0;
  border: none;
  border-radius: 12px;
  background: #0071E3;
  color: #FFFFFF;
  cursor: pointer;
}

    .btn-login:hover { background: #106ebe; }

    .btn-login:disabled {
      background: #8bb8da;
      cursor: not-allowed;
    }

    #content {
      display: none;
      width: 100%;
      height: 100%;
      background: #fff;
    }

#topbar {
  position: fixed;
  top: 20px;
  right: 200px;
  z-index: 1000;
  display: flex;
  gap: 10px;
  align-items: center;
}

#btnLogout {
  background: #d13438;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
}

    #btnLogout:hover { background: #a4262c; }

iframe {
  width: 100%;
  height: 100vh;
  border: none;
  display: block;
}

    .hint {
      color: #666;
      font-size: 12px;
      margin-top: 10px;
      line-height: 1.4;
    }

    .hint code {
      background: #f1f1f1;
      padding: 2px 6px;
      border-radius: 4px;
    }

#header-bars {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 9999;
}

.barra-escura {
  width: 100%;
  height: 65px;
  background: #3C3C3C;
}

.barra-clara {
  position: relative;
  width: 100%;
  height: 48px;
  background: #FBFBFD;
}

.barra-clara > img {
  position: absolute;
  left: 22.5%;
  top: 54%;
  transform: translate(-50%, -50%);

  width: 31px !important;
  height: 31px !important;
  max-width: 31px !important;
  max-height: 31px !important;

  object-fit: contain;
  display: block;
}

.linha-tecnicos {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

.login-card .logo-directv-titulo {
  display: inline-block;
  width: 80px;
  height: auto;
  margin: 0;
  object-fit: contain;
  flex-shrink: 0;
}
    
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.0/lib/msal-browser.min.js"></script>
</head>

<body>


<div id="header-bars">
  <div class="barra-escura"></div>
  <div class="barra-clara">
    <img src="imagenes/icon_gpt_cinza.png" alt="Ícone GPT">
  </div>
</div>

  <div id="login-screen">
    <div class="login-card">
      <h2>
        Guia de<br>
        Procedimientos<br>
        <span class="linha-tecnicos">
        Técnicos
        <img src="imagenes/directv.png">
  </span>
</h2>
      <p>Inicia sesión para acceder a los manuales de atención técnica.</p>
    <button id="btnLogin" class="btn-login" onclick="login()" disabled>
  Entrar
</button>

<div id="status" class="status">
  Carregando autenticação...
</div>

    </div>
  </div>

  <div id="content">

    <div id="topbar">
      <button id="btnLogout" onclick="logout()">Sair</button>
    </div>

    <iframe id="docFrame" src="about:blank"></iframe>
  </div>

  <script>

function showContent() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("header-bars").style.display = "none";
  document.getElementById("content").style.display = "block";
}
    
    // =====================================================================
    // 1) MAPA DE DOCUMENTOS
    //    Ajuste aqui para cada PDF. O link no PDF/HTML deve apontar para:
    //    index.html?doc=<chave>
    // =====================================================================
function getDocInfo(docKey) {

  const specialDocs = {
    gpt: {
      title: "Guia de Procedimentos Técnicos (GPT)",
      path: "archivos_pdf/gpt.pdf"
    }
  };

  if (specialDocs[docKey]) {
    return specialDocs[docKey];
  }

  return {
    title: docKey
      .replaceAll("_", " ")
      .replaceAll("-", " ")
      .toUpperCase(),
    path: `archivos_pdf/gpt_${docKey}.pdf`
  };
}

    // =====================================================================
    // 2) SELECIONA DOCUMENTO VIA ?doc=
    // =====================================================================
    function getRequestedDocKey() {
      const params = new URLSearchParams(window.location.search);
      return params.get("doc") || "gpt";
    }

function setDocument(docKey) {

  const frame = document.getElementById("docFrame");

  let pdfFile;

  if (docKey === "gpt") {
    pdfFile = "gpt.pdf";
  } else {
    pdfFile = `gpt_${docKey}.pdf`;
  }

  frame.src = `archivos_pdf/${pdfFile}#view=FitH`;
}

    // =====================================================================
    // 3) MSAL CONFIG
    // =====================================================================
    const redirectUri = window.location.origin + window.location.pathname;

    const msalConfig = {
      auth: {
        clientId: "bd3d9316-4683-4aea-ad47-8c237cdceb5e",
        authority: "https://login.microsoftonline.com/4abdf8c8-91c3-4c1b-9c71-6266b586ec6b",
        redirectUri
      },
      cache: {
        cacheLocation: "sessionStorage",
        storeAuthStateInCookie: false
      }
    };

    const loginRequest = {
      scopes: ["openid", "profile", "email", "User.Read"]
    };

    let msalInstance = null;

    function setStatus(text) {
      const el = document.getElementById("status");
      if (el) el.textContent = text;
    }

function showLogin() {
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("header-bars").style.display = "block";
  document.getElementById("content").style.display = "none";
  document.getElementById("btnLogin").disabled = false;
}

    function getBestAccount() {
      if (!msalInstance) return null;
      return msalInstance.getActiveAccount() || msalInstance.getAllAccounts()[0] || null;
    }

    async function enforceAuthAndLoadDoc() {
      const account = getBestAccount();

      if (!account) {
        showLogin();
        setStatus("Pronto para autenticar.");
        return;
      }

      msalInstance.setActiveAccount(account);
      showContent();

      // Carrega o PDF correto conforme a URL atual
      const docKey = getRequestedDocKey();
      setDocument(docKey);
    }

    async function initializeMsal() {
      try {
        setStatus("Carregando autenticação...");
        document.getElementById("btnLogin").disabled = true;

        if (typeof msal === "undefined") {
          setStatus("MSAL não carregou.");
          console.error("msal undefined");
          document.getElementById("btnLogin").disabled = false;
          return;
        }

        msalInstance = new msal.PublicClientApplication(msalConfig);

        if (typeof msalInstance.initialize === "function") {
          await msalInstance.initialize();
        }

        await enforceAuthAndLoadDoc();
      } catch (error) {
        console.error("Erro ao inicializar MSAL:", error);
        setStatus("Erro ao inicializar a autenticação.");
        showLogin();
      }
    }

    async function login() {
  try {

    if (!msalInstance) {
      alert("MSAL ainda não foi inicializado.");
      return;
    }

    document.getElementById("btnLogin").disabled = true;
    setStatus("Abrindo login da Microsoft...");

    // Limpa a conta ativa antes de abrir o login
    msalInstance.setActiveAccount(null);

    const res = await msalInstance.loginPopup({
      ...loginRequest,
      prompt: "select_account"
    });

    if (res && res.account) {
      msalInstance.setActiveAccount(res.account);
    }

    await enforceAuthAndLoadDoc();

  } catch (error) {

    console.error("Erro no login:", error);

    setStatus("Falha na autenticação.");
    alert("Não foi possível realizar a autenticação.");

    document.getElementById("btnLogin").disabled = false;
  }
}

async function logout() {
  try {

    const account = getBestAccount();

    await msalInstance.logoutPopup({
      account
    });

    msalInstance.setActiveAccount(null);

  } catch (error) {
    console.error("Erro ao sair:", error);
  }
}

    // Revalida ao voltar para a aba / e recarrega doc ao navegar com back/forward
    window.addEventListener("focus", () => {
      if (msalInstance) enforceAuthAndLoadDoc().catch(console.error);
    });

    window.addEventListener("popstate", () => {
      if (msalInstance) enforceAuthAndLoadDoc().catch(console.error);
    });

    window.addEventListener("load", initializeMsal);
  </script>
</body>
</html>
