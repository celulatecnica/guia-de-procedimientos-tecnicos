<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPT Directv Latinoamérica</title>
  <link rel="icon" type="image/png" href="imagenes/logo-directv.png">
  <style>
html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #FFFFFF;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: #0F0F0F;
  color: #f5f5f7;
  padding-top: 0;
}

.btn-login {
  width: 220px;
  height: 48px;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  margin: 0 auto;

  border: none;

  border-radius: 12px;

  background: #0071E3;

  color: #FFFFFF;

  font-size: 16px;
  font-weight: 600;

  cursor: pointer;
}

.btn-login .icone-entrar {
  display: block;
  width: 24px;
  height: 24px;
  max-width: 24px;
  max-height: 24px;
  margin: 0;
  object-fit: contain;
  flex-shrink: 0;
}
    
.login-header {
  margin-bottom: 20px;
}

.btn-login:hover { background: #106ebe; }

.btn-login:disabled {
  background: #8bb8da;
  cursor: not-allowed;
}

#content {
  display: none;
  width: 100%;
  height: 100%;
  background: #fff;
}

#topbar {
  position: fixed;
  top: 20px;
  right: 200px;
  z-index: 1000;
  display: flex;
  gap: 10px;
  align-items: center;
}

#btnLogout {
  background: #d13438;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
}

    #btnLogout:hover { background: #a4262c; }

iframe {
  width: 100%;
  height: 100vh;
  border: none;
  display: block;
}

.hint {
  color: #666;
  font-size: 12px;
  margin-top: 10px;
  line-height: 1.4;
}

.hint code {
  background: #f1f1f1;
  padding: 2px 6px;
  border-radius: 4px;
}

.linha-tecnicos {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
    
.logo-directv-titulo {
  width: 80px !important;
  height: auto !important;
  max-width: 80px !important;
  max-height: 35px !important;
  object-fit: contain;
  flex-shrink: 0;
  vertical-align: middle;
}

.app-locked {
  filter: blur(12px);
  pointer-events: none;
  user-select: none;
}

.login-overlay {
  position: fixed;
  inset: 0;
  z-index: 99999;

  display: flex;
  justify-content: center;
  align-items: center;

  background: rgba(0,0,0,.45);
}

.login-overlay.hidden {
  display: none;
}

.login-card {
  width: 520px;
  max-width: calc(100% - 32px);
  background: rgba(23,23,23,.95);
  border: 1px solid #2A2A2A;
  border-radius: 16px;
  padding: 48px;
  text-align: center;
  color: #F5F5F7;
  box-shadow: 0 25px 80px rgba(0,0,0,.50);
}

.login-logo {
  height: 50px;
  margin-left: auto;
  margin-right: auto;
  margin-bottom: 12px;
  display: block;
}

.login-title {
  margin: 0;

  font-size: 28px;
  font-weight: 600;

  color: #F5F5F7;
}

.login-card h2 {
  margin: 0;
  font-size: 28px;
  font-weight: 600;
  color: #F5F5F7;
}

.login-description {
  margin: 16px 0 24px 0;
  font-size: 16px;
  line-height: 1.6;
  color: #D1D1D6;
}

.status {
  margin-top: 12px;
  font-size: 13px;
  color: #8e8e93;
}

</style>

  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.0/lib/msal-browser.min.js"></script>
</head>

<body>
   
 <div id="loginOverlay" class="login-overlay">
    <div class="login-card">
      <div class="login-header">
        <img src="imagenes/directv.png" alt="GPT" class="login-logo">
        <h2> Guía de Procedimientos Técnicos</h2>
      </div>
      
    <p class="login-description">
      Inicia sesión con tu cuenta corporativa para acceder 
      <br>
      a los manuales de atención técnica.
    </p>

    <button
      id="btnLogin"
      class="btn-login"
      onclick="login()"
      disabled>

      <img src="imagenes/icon_entrar.png">

      <span>Entrar</span>

    </button>

    <div id="status" class="status">
      Carregando autenticação...
    </div>

  </div>

</div>

<div id="appContent" class="app-locked">
  
<div id="content">

    <div id="topbar">
      <button id="btnLogout" onclick="logout()">Sair</button>
    </div>

    <iframe id="docFrame" src="about:blank"></iframe>
</div>

</div>

<script>

function showContent() {

  document
    .getElementById("loginOverlay")
    .classList.add("hidden");

  document
    .getElementById("appContent")
    .classList.remove("app-locked");

  document
    .getElementById("content")
    .style.display = "block";
}
    
    // =====================================================================
    // 1) MAPA DE DOCUMENTOS
    //    Ajuste aqui para cada PDF. O link no PDF/HTML deve apontar para:
    //    index.html?doc=<chave>
    // =====================================================================
function getDocInfo(docKey) {

  const specialDocs = {
    gpt: {
      title: "Guia de Procedimentos Técnicos (GPT)",
      path: "archivos_pdf/gpt.pdf"
    }
  };

  if (specialDocs[docKey]) {
    return specialDocs[docKey];
  }

  return {
    title: docKey
      .replaceAll("_", " ")
      .replaceAll("-", " ")
      .toUpperCase(),
    path: `archivos_pdf/gpt_${docKey}.pdf`
  };
}

    // =====================================================================
    // 2) SELECIONA DOCUMENTO VIA ?doc=
    // =====================================================================
    function getRequestedDocKey() {
      const params = new URLSearchParams(window.location.search);
      return params.get("doc") || "gpt";
    }

function setDocument(docKey) {

  const frame = document.getElementById("docFrame");

  let pdfFile;

  if (docKey === "gpt") {
    pdfFile = "gpt.pdf";
  } else {
    pdfFile = `gpt_${docKey}.pdf`;
  }

  frame.src = `archivos_pdf/${pdfFile}#view=FitH`;
}

    // =====================================================================
    // 3) MSAL CONFIG
    // =====================================================================
    const redirectUri = window.location.origin + window.location.pathname;

    const msalConfig = {
      auth: {
        clientId: "bd3d9316-4683-4aea-ad47-8c237cdceb5e",
        authority: "https://login.microsoftonline.com/4abdf8c8-91c3-4c1b-9c71-6266b586ec6b",
        redirectUri
      },
      cache: {
        cacheLocation: "sessionStorage",
        storeAuthStateInCookie: false
      }
    };

    const loginRequest = {
      scopes: ["openid", "profile", "email", "User.Read"]
    };

    let msalInstance = null;

    function setStatus(text) {
      const el = document.getElementById("status");
      if (el) el.textContent = text;
    }

function showLogin() {

  document
    .getElementById("loginOverlay")
    .classList.remove("hidden");

  document
    .getElementById("appContent")
    .classList.add("app-locked");

  document
    .getElementById("btnLogin")
    .disabled = false;
}

    function getBestAccount() {
      if (!msalInstance) return null;
      return msalInstance.getActiveAccount() || msalInstance.getAllAccounts()[0] || null;
    }

    async function enforceAuthAndLoadDoc() {
      const account = getBestAccount();

      if (!account) {
        showLogin();
        setStatus("Pronto para autenticar.");
        return;
      }

      msalInstance.setActiveAccount(account);
      showContent();

      // Carrega o PDF correto conforme a URL atual
      const docKey = getRequestedDocKey();
      setDocument(docKey);
    }

    async function initializeMsal() {
      try {
        setStatus("Carregando autenticação...");
        document.getElementById("btnLogin").disabled = true;

        if (typeof msal === "undefined") {
          setStatus("MSAL não carregou.");
          console.error("msal undefined");
          document.getElementById("btnLogin").disabled = false;
          return;
        }

        msalInstance = new msal.PublicClientApplication(msalConfig);

        if (typeof msalInstance.initialize === "function") {
          await msalInstance.initialize();
        }

        await enforceAuthAndLoadDoc();
      } catch (error) {
        console.error("Erro ao inicializar MSAL:", error);
        setStatus("Erro ao inicializar a autenticação.");
        showLogin();
      }
    }

    async function login() {
  try {

    if (!msalInstance) {
      alert("MSAL ainda não foi inicializado.");
      return;
    }

    document.getElementById("btnLogin").disabled = true;
    setStatus("Abrindo login da Microsoft...");

    // Limpa a conta ativa antes de abrir o login
    msalInstance.setActiveAccount(null);

    const res = await msalInstance.loginPopup({
      ...loginRequest,
      prompt: "select_account"
    });

    if (res && res.account) {
      msalInstance.setActiveAccount(res.account);
    }

    await enforceAuthAndLoadDoc();

  } catch (error) {

    console.error("Erro no login:", error);

    setStatus("Falha na autenticação.");
    alert("Não foi possível realizar a autenticação.");

    document.getElementById("btnLogin").disabled = false;
  }
}

async function logout() {
  try {

    const account = getBestAccount();

    await msalInstance.logoutPopup({
      account
    });

    msalInstance.setActiveAccount(null);

  } catch (error) {
    console.error("Erro ao sair:", error);
  }
}

    // Revalida ao voltar para a aba / e recarrega doc ao navegar com back/forward
    window.addEventListener("focus", () => {
      if (msalInstance) enforceAuthAndLoadDoc().catch(console.error);
    });

    window.addEventListener("popstate", () => {
      if (msalInstance) enforceAuthAndLoadDoc().catch(console.error);
    });

    window.addEventListener("load", initializeMsal);
  </script>
</body>
</html>
