<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPT Directv Latinoamérica</title>
  <link rel="icon" type="image/png" href="imagenes/logo-directv.png">
  <style>
    * {
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    html,
    body {
      margin: 0;
      overflow-x: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0F0F0F;
      color: #f5f5f7;
      padding-top: 0;
    }
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- CONTEÚDO PRINCIPAL -->
  <div id="appContent">
    <iframe id="docFrame"></iframe>
  </div>

  <script>
    // =====================================================================
    // DEBUG HELPER
    // =====================================================================
    const DEBUG = true;
    function log(label, message) {
      if (DEBUG) {
        console.log(`[${new Date().toLocaleTimeString()}] ${label}: ${message}`);
      }
    }

    function logError(label, error) {
      if (DEBUG) {
        console.error(`[${new Date().toLocaleTimeString()}] ${label}:`, error);
      }
    }

    // =====================================================================
    // UTILITY FUNCTIONS
    // =====================================================================

    function getRequestedDocKey() {
      const params = new URLSearchParams(window.location.search);
      return params.get("doc") || "gpt";
    }

    function loadDocument(docKey) {
      const frame = document.getElementById("docFrame");
      let pdfFile = docKey === "gpt" ? "gpt.pdf" : `gpt_${docKey}.pdf`;
      frame.src = `archivos_pdf/${pdfFile}#view=FitH`;
      log("DOC", `Documento carregado: ${pdfFile}`);
    }

    // =====================================================================
    // EVENT LISTENERS
    // =====================================================================
    
    window.addEventListener("load", () => {
      log("APP", "Página carregada");
      
      const docKey = getRequestedDocKey();
      loadDocument(docKey);
    });

  </script>
</body>
</html>
