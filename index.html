<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teste Login Microsoft</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    .card {
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.12);
      text-align: center;
      width: 380px;
      max-width: calc(100% - 40px);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      margin-bottom: 16px;
    }

    button {
      background: #0078d4;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #106ebe;
    }

    button:disabled {
      background: #8bb8da;
      cursor: not-allowed;
    }

    #logoutBtn {
      display: none;
      background: #d13438;
      margin-top: 10px;
    }

    #logoutBtn:hover {
      background: #a4262c;
    }

    #status {
      margin-top: 16px;
      font-size: 14px;
      color: #444;
      min-height: 20px;
      word-break: break-word;
    }

    #redirectInfo {
      margin-top: 10px;
      font-size: 12px;
      color: #777;
      word-break: break-word;
      line-height: 1.4;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.0/lib/msal-browser.min.js"></script>
</head>
<body>
  <div class="card">
    <h2>Teste de Login Microsoft</h2>
    <p>Use sua conta corporativa para validar a autenticação.</p>

    <button id="loginBtn" onclick="login()" disabled>Entrar com Microsoft</button>
    <button id="logoutBtn" onclick="logout()">Sair</button>

    <div id="status">Carregando...</div>
    <div id="redirectInfo"></div>
  </div>

  <script>
    const redirectUri = window.location.origin + window.location.pathname;

    const msalConfig = {
      auth: {
        clientId: "bd3d9316-4683-4aea-ad47-8c237cdceb5e",
        authority: "https://login.microsoftonline.com/4abdf8c8-91c3-4c1b-9c71-6266b586ec6b",
        redirectUri: redirectUri
      },
      cache: {
        cacheLocation: "sessionStorage",
        storeAuthStateInCookie: false
      }
    };

    const loginRequest = {
      scopes: ["User.Read", "openid", "profile", "email"]
    };

    let msalInstance = null;

    function setStatus(text) {
      document.getElementById("status").textContent = text;
    }

    function showLoginState() {
      document.getElementById("loginBtn").style.display = "inline-block";
      document.getElementById("logoutBtn").style.display = "none";
    }

    function showLoggedState() {
      document.getElementById("loginBtn").style.display = "none";
      document.getElementById("logoutBtn").style.display = "inline-block";
    }

    function updateUserInfo(account) {
      if (account) {
        setStatus("Logado como: " + (account.username || account.name || "usuário autenticado"));
        showLoggedState();
      } else {
        setStatus("Nenhum usuário autenticado.");
        showLoginState();
      }
    }

    async function init() {
      try {
        document.getElementById("redirectInfo").textContent = "Redirect URI usado: " + redirectUri;

        if (typeof msal === "undefined") {
          setStatus("MSAL não carregou.");
          console.error("msal undefined");
          return;
        }

        msalInstance = new msal.PublicClientApplication(msalConfig);
        await msalInstance.initialize();

        const accounts = msalInstance.getAllAccounts();
        const account = msalInstance.getActiveAccount() || accounts[0] || null;

        if (account) {
          msalInstance.setActiveAccount(account);
        }

        updateUserInfo(account);
        document.getElementById("loginBtn").disabled = false;
      } catch (error) {
        console.error("Erro ao inicializar:", error);
        setStatus("Erro ao inicializar MSAL.");
        document.getElementById("loginBtn").disabled = false;
        showLoginState();
      }
    }

    async function login() {
      try {
        if (!msalInstance) {
          alert("MSAL não inicializado.");
          return;
        }

        document.getElementById("loginBtn").disabled = true;
        setStatus("Abrindo login da Microsoft...");

        const response = await msalInstance.loginPopup(loginRequest);

        if (response && response.account) {
          msalInstance.setActiveAccount(response.account);
          updateUserInfo(response.account);
        } else {
          updateUserInfo(msalInstance.getActiveAccount());
        }

        document.getElementById("loginBtn").disabled = false;
      } catch (error) {
        console.error("Erro no login:", error);
        setStatus("Falha no login. Veja o console.");
        document.getElementById("loginBtn").disabled = false;
        showLoginState();
      }
    }

    async function logout() {
      try {
        const account = msalInstance.getActiveAccount();
        if (account) {
          await msalInstance.logoutPopup({ account });
        } else {
          await msalInstance.logoutPopup();
        }
      } catch (error) {
        console.error("Erro ao sair:", error);
      } finally {
        msalInstance.setActiveAccount(null);
        updateUserInfo(null);
      }
    }

    window.addEventListener("load", init);
  </script>
</body>
</html>
