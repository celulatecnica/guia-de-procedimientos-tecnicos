<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPT Directv Latinoamérica</title>
  <link rel="icon" type="image/png" href="imagenes/logo-directv.png">
  <style>
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
html,
body {
  margin: 0;
  overflow-x: hidden;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: #0F0F0F;
  color: #f5f5f7;
  padding-top: 0;
}
.btn-login {
  width: 50%;
  height: 48px;
  padding: 0;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  background: #0071e3;
  color: white;
  border: none;
  border-radius: 12px;
  transition: all 0.2s ease;
}
.btn-login:hover:not(:disabled) {
  background: #0077ED;
  transform: translateY(-1px);
}
.btn-login:active:not(:disabled) {
  transform: translateY(0);
}
.btn-login:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.login-header {
  margin-bottom: 20px;
}
#topbar {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1000;
  display: flex;
  gap: 10px;
  align-items: center;
}
#btnLogout {
  background: #0071e3;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s ease;
}
#btnLogout:hover {
  background: #0077ED;
}
iframe {
  width: 100%;
  height: 100vh;
  border: none;
  display: block;
}
.app-locked {
  filter: blur(12px);
  pointer-events: none;
  user-select: none;
  transition: filter 0.3s ease;
}
.app-unlocked {
  filter: blur(0);
  pointer-events: auto;
  user-select: auto;
}
.login-overlay {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(0, 0, 0, 0.45);
}
.login-overlay.hidden {
  display: none;
}
.login-card {
  width: 520px;
  max-width: calc(100% - 32px);
  background: rgba(23, 23, 23, 0.95);
  border: 1px solid #2A2A2A;
  border-radius: 16px;
  padding: 48px;
  box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
  color: #f5f5f7;
  text-align: center;
  animation: slideUp 0.4s ease;
}
@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.login-logo {
  height: 24px;
  margin-left: auto;
  margin-right: auto;
  margin-bottom: 24px;
  display: block;
}
.login-card h2 {
  margin: 0;
  font-size: 28px;
  font-weight: 600;
  color: #f5f5f7;
}
.login-description {
  margin: 16px 0 24px 0;
  font-size: 16px;
  line-height: 1.6;
  color: #d1d1d6;
}
.status {
  margin-top: 12px;
  font-size: 13px;
  color: #8e8e93;
}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.0/lib/msal-browser.min.js"></script>
</head>
<body>
  <!-- CONTEÚDO PRINCIPAL -->
  <div id="appContent" class="app-locked">
    <div id="topbar">
      <button id="btnLogout" onclick="logout()">Sair</button>
    </div>
    <iframe id="docFrame" src="about:blank"></iframe>
  </div>

  <!-- OVERLAY DE LOGIN -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-card">
      <div class="login-header">
        <img src="imagenes/directv.png" alt="Directv" class="login-logo">
        <h2>Guía de Procedimientos Técnicos/h2>
      </div>
      <p class="login-description">
        Inicia sesión con tu cuenta corporativa para aceder a los manuales de atención técnica.
      </p>
      <button id="btnLogin" class="btn-login" onclick="login()" disabled>
        <span>Entrar</span>
      </button>
      <div id="status" class="status">Carregando autenticação...</div>
    </div>
  </div>

  <script>
    // =====================================================================
    // MSAL CONFIG
    // =====================================================================
    const redirectUri = window.location.origin + window.location.pathname;
    const msalConfig = {
      auth: {
        clientId: "bd3d9316-4683-4aea-ad47-8c237cdceb5e",
        authority: "https://login.microsoftonline.com/4abdf8c8-91c3-4c1b-9c71-6266b586ec6b",
        redirectUri
      },
      cache: {
        cacheLocation: "sessionStorage",
        storeAuthStateInCookie: false
      }
    };
    const loginRequest = {
      scopes: ["openid", "profile", "email", "User.Read"]
    };
    let msalInstance = null;

    // =====================================================================
    // FUNÇÕES DE UI
    // =====================================================================
    function setStatus(text) {
      const el = document.getElementById("status");
      if (el) el.textContent = text;
    }

    function showLoginOverlay() {
      document.getElementById("loginOverlay").classList.remove("hidden");
      document.getElementById("appContent").classList.add("app-locked");
      document.getElementById("btnLogin").disabled = false;
    }

    function hideLoginOverlay() {
      document.getElementById("loginOverlay").classList.add("hidden");
      document.getElementById("appContent").classList.remove("app-locked");
    }

    // =====================================================================
    // AUTENTICAÇÃO
    // =====================================================================
    function getBestAccount() {
      if (!msalInstance) return null;
      return msalInstance.getActiveAccount() || msalInstance.getAllAccounts()[0] || null;
    }

    function getRequestedDocKey() {
      const params = new URLSearchParams(window.location.search);
      return params.get("doc") || "gpt";
    }

    function setDocument(docKey) {
      const frame = document.getElementById("docFrame");
      let pdfFile;
      if (docKey === "gpt") {
        pdfFile = "gpt.pdf";
      } else {
        pdfFile = `gpt_${docKey}.pdf`;
      }
      frame.src = `archivos_pdf/${pdfFile}#view=FitH`;
    }

    async function enforceAuthAndLoadDoc() {
      const account = getBestAccount();
      if (!account) {
        showLoginOverlay();
        setStatus("Pronto para autenticar.");
        return;
      }
      msalInstance.setActiveAccount(account);
      hideLoginOverlay();
      const docKey = getRequestedDocKey();
      setDocument(docKey);
    }

    async function initializeMsal() {
      try {
        setStatus("Carregando autenticação...");
        document.getElementById("btnLogin").disabled = true;
        if (typeof msal === "undefined") {
          setStatus("MSAL não carregou.");
          console.error("msal undefined");
          document.getElementById("btnLogin").disabled = false;
          return;
        }
        msalInstance = new msal.PublicClientApplication(msalConfig);
        if (typeof msalInstance.initialize === "function") {
          await msalInstance.initialize();
        }
        await msalInstance.handleRedirectPromise();
        await enforceAuthAndLoadDoc();
      } catch (error) {
        console.error("Erro ao inicializar MSAL:", error);
        setStatus("Erro ao inicializar a autenticação.");
        showLoginOverlay();
      }
    }

    async function login() {
      try {
        if (!msalInstance) {
          alert("MSAL ainda não foi inicializado.");
          return;
        }
        document.getElementById("btnLogin").disabled = true;
        setStatus("Abrindo login da Microsoft...");
        msalInstance.setActiveAccount(null);
        const res = await msalInstance.loginPopup({
          ...loginRequest,
          prompt: "select_account"
        });
        if (res && res.account) {
          msalInstance.setActiveAccount(res.account);
        }
        await enforceAuthAndLoadDoc();
      } catch (error) {
        console.error("Erro no login:", error);
        setStatus("Falha na autenticação.");
        alert("Não foi possível realizar a autenticação.");
        document.getElementById("btnLogin").disabled = false;
      }
    }

    async function logout() {
      try {
        const account = getBestAccount();
        if (account) {
          await msalInstance.logoutPopup({ account });
        }
        msalInstance.setActiveAccount(null);
        showLoginOverlay();
        setStatus("Sessão encerrada. Faça login novamente.");
      } catch (error) {
        console.error("Erro ao sair:", error);
      }
    }

    // =====================================================================
    // EVENT LISTENERS
    // =====================================================================
    window.addEventListener("focus", () => {
      if (msalInstance) enforceAuthAndLoadDoc().catch(console.error);
    });
    window.addEventListener("popstate", () => {
      if (msalInstance) enforceAuthAndLoadDoc().catch(console.error);
    });
    window.addEventListener("load", initializeMsal);
  </script>
</body>
</html>
