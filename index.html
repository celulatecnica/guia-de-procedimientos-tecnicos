<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teste Login Microsoft</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.12);
      text-align: center;
      width: 360px;
      max-width: calc(100% - 40px);
    }

    h1 {
      font-size: 22px;
      margin-bottom: 12px;
    }

    p {
      color: #666;
      margin-bottom: 20px;
    }

    button {
      background: #0078d4;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #106ebe;
    }

    button:disabled {
      background: #8bb8da;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      font-size: 14px;
      color: #444;
      min-height: 20px;
      word-break: break-word;
    }

    #logoutBtn {
      margin-top: 12px;
      background: #d13438;
      display: none;
    }

    #logoutBtn:hover {
      background: #a4262c;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/msal-browser/2.38.0/msal-browser.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="card">
    <h1>Teste de Login Microsoft</h1>
    <p>Use sua conta corporativa para validar a autenticação.</p>

    <button id="loginBtn" onclick="login()" disabled>Entrar com Microsoft</button>
    <button id="logoutBtn" onclick="logout()">Sair</button>

    <div id="status">Carregando...</div>
  </div>

  <script>
    const msalConfig = {
      auth: {
        clientId: "bd3d9316-4683-4aea-ad47-8c237cdceb5e",
        authority: "https://login.microsoftonline.com/4abdf8c8-91c3-4c1b-9c71-6266b586ec6b",
        redirectUri: "https://celulatecnica.github.io/guia-de-procedimientos-tecnicos/"
      },
      cache: {
        cacheLocation: "sessionStorage",
        storeAuthStateInCookie: false
      }
    };

    const loginRequest = {
      scopes: ["User.Read", "openid", "profile", "email"]
    };

    let msalInstance;

    function setStatus(text) {
      document.getElementById("status").textContent = text;
    }

    function updateUI(account) {
      if (account) {
        document.getElementById("loginBtn").style.display = "none";
        document.getElementById("logoutBtn").style.display = "inline-block";
        setStatus(`Logado como: ${account.username || account.name || "usuário autenticado"}`);
      } else {
        document.getElementById("loginBtn").style.display = "inline-block";
        document.getElementById("logoutBtn").style.display = "none";
        setStatus("Nenhum usuário autenticado.");
      }
    }

    async function init() {
      try {
        msalInstance = new msal.PublicClientApplication(msalConfig);
        await msalInstance.initialize();

        const result = await msalInstance.handleRedirectPromise();
        if (result && result.account) {
          msalInstance.setActiveAccount(result.account);
        }

        const accounts = msalInstance.getAllAccounts();
        const account = msalInstance.getActiveAccount() || accounts[0] || null;

        if (account) {
          msalInstance.setActiveAccount(account);
        }

        updateUI(account);
        document.getElementById("loginBtn").disabled = false;
      } catch (error) {
        console.error(error);
        setStatus("Erro ao iniciar o MSAL. Veja o console.");
        document.getElementById("loginBtn").disabled = false;
      }
    }

    async function login() {
      try {
        document.getElementById("loginBtn").disabled = true;
        setStatus("Abrindo login...");

        const response = await msalInstance.loginPopup(loginRequest);
        if (response && response.account) {
          msalInstance.setActiveAccount(response.account);
          updateUI(response.account);
        } else {
          updateUI(msalInstance.getActiveAccount());
        }

        document.getElementById("loginBtn").disabled = false;
      } catch (error) {
        console.error(error);
        setStatus("Falha no login. Veja o console.");
        document.getElementById("loginBtn").disabled = false;
      }
    }

    async function logout() {
      try {
        const account = msalInstance.getActiveAccount();
        if (account) {
          await msalInstance.logoutPopup({ account });
        } else {
          await msalInstance.logoutPopup();
        }
      } catch (error) {
        console.error(error);
      } finally {
        msalInstance.setActiveAccount(null);
        updateUI(null);
      }
    }

    window.addEventListener("load", init);
  </script>
</body>
</html>
